sources: [oikotie, etuovi]
max_listings: 300

filters:
  # kerrostalo, rivitalo, paritalo, erillistalo, omakotitalo, luhtitalo, puutalo-osake
  house_types: [omakotitalo, paritalo, erillistalo, rivitalo]
  rooms: [4, 5]            # 5 means 5 or more
  plot_ownership: [own]    # own, rent
  price_min: null
  price_max: 600000
  size_min: 90
  size_max: null
  build_year_min: 1980
  build_year_max: null
  municipalities: [Espoo, Vantaa, Kauniainen]   # empty = all of Uusimaa

destinations:
  - name: Work
    address: Keilaniemi, Espoo
    modes: [transit, car]
    weight: 2
    max_minutes: {car:
  rush_hour_factor: 1.2   # OSRM times assume empty roads

nearby_services: true     # nearest daycare, school, grocery store (straight-line)

transit: 45}
  - name: Helsinki centre
    address: Rautatieasema, Helsinki
  - name: School
    address: Tapiolan koulu, Espoo
    modes: [bike, walk]
    max_minutes: {bike: 20}
  - name: Grandparents
    lat: 61.4978
    lon: 23.7610
    modes: [car]

car:
  rush_hour_factor: 1.2   # OSRM times assume empty roads

nearby_services: true     # nearest daycare, school, grocery store (straight-line)

transit:
  # Free key from https://portal-api.digitransit.fi/ ; or set DIGITRANSIT_API_KEY
  api_key: null
  router: hsl            # hsl or finland; finland is used as a fallback automatically
  arrive_by: "09:00"     # or depart_at: "08:00"
  day: tuesday           # next occurrence of this weekday
  requests_per_second: 2

map:
  # Colours as a fraction of each destination's max_minutes:
  # green up to max_minutes × green_factor, fully red from max_minutes × red_factor.
  green_factor: 0.5
  red_factor: 1
  default_max_minutes: 60   # limit for a destination's main mode when it has no max_minutes
  fade_km: 3                # colour fades out this far from the nearest house
  idw_power: 2              # higher = nearer houses dominate the interpolation

output_dir: output
